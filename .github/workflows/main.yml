name: CI/CD Pipeline for AI Agent

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint and Test Backend
    runs-on: ubuntu-latest

    # Throwaway credentials for the MySQL service container below
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: shop_db

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: shop_db
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt flake8

    - name: Lint with flake8
      run: |
        flake8 app test --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app test --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Seed the database
      run: mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_password < data/init.sql

    # Tests marked "ollama" need a local model, which the CI runner does not have
    - name: Run tests with pytest
      run: pytest -m "not ollama"

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Build Docker image
      run: docker build -t ai-database-agent:${{ github.sha }} .
